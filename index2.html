<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Basic Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    header {
      background-color: #333;
      color: white;
      padding: 1em;
      text-align: center;
    }
    nav {
      background-color: #444;
      padding: 0.5em;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 1em;
      text-decoration: none;
    }
    main {
      padding: 2em;
    }
    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 1em;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
    button {
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Bersama Food Industries</h1>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Menu</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
    <a href="https://tiktok.com/@bersamafood" target="_blank">Tiktok</a>
  </nav>

  <main>
    <h2>Taste Way Better</h2>
    <p>Our food has become the food of choice for families in Johor. We have also received good reviews from our regular customers.</p>
    <button onclick="sayHello()">Click Me</button>
  </main>

  <footer>
    &copy; 2025 My Website
  </footer>

  <script>
    function sayHello() {
      alert("Hello! Thanks for clicking.");
    }
  </script>

</body>
</html>
